<style>
  :root{--navy:#1f3a5f;--light:#eef2f7;--gray:#6e7887;--line:#d7dee7;}

  .wrap{max-width:1000px;margin:0 auto;padding:28px 24px 64px}
  h1{font-size:20px;color:var(--navy);margin:0 0 16px;font-weight:800}
  textarea{width:100%;height:170px;padding:14px;border:1px solid var(--line);border-radius:14px;font-size:14px;background:#fff}
  .row{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
  .fld{display:flex;flex-direction:column;font-size:12px;color:var(--gray)}
  .fld input,.fld select{margin-top:3px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:14px;color:#1a1a1a}
  button{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-size:14px;cursor:pointer}
  button.sec{background:#fff;color:var(--navy);border:1px solid var(--navy)}
  .panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin:16px 0;box-shadow:0 1px 2px rgba(38,49,74,.04),0 6px 24px rgba(38,49,74,.055)}
  .hint{font-size:12px;color:#b4521a;margin-top:6px}

  /* 견적서 */
  #quote{display:none}
  .doc{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .doc .band{background:var(--navy);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:flex-end}
  .doc .band .t1{font-size:20px;font-weight:700} .doc .band .t2{font-size:11px;opacity:.9}
  .doc .band .meta{font-size:11px;text-align:right;line-height:1.6}
  .doc .body{padding:18px 20px}
  .cust{font-size:14px;font-weight:700;margin:2px 0 10px;border-bottom:1px solid var(--line);padding-bottom:8px}
  .sec-title{color:var(--navy);font-weight:700;font-size:13px;border-bottom:2px solid var(--navy);display:inline-block;padding-bottom:2px;margin:14px 0 6px}
  table.kv{border-collapse:collapse;width:100%;font-size:13px} table.kv td{padding:3px 0} table.kv td.k{color:var(--gray);width:120px}
  .usd{text-align:right;font-weight:700;color:var(--gray);font-size:12px;margin-top:12px;padding-right:10px}
  table.fee{border-collapse:collapse;width:100%;font-size:13px;margin-top:2px}
  table.fee th,table.fee td{border:1px solid var(--line);padding:7px 9px}
  table.fee th{background:var(--navy);color:#fff}
  table.fee td.r,table.fee th.r{text-align:right}
  table.fee tr:nth-child(even) td{background:var(--light)}
  .sum{margin-top:8px;font-size:13px} .sum .line{display:flex;justify-content:flex-end;gap:16px;padding:2px 10px 2px 0}
  .sum .line .lbl{color:var(--gray)} .sum .final{background:var(--light);font-weight:700;font-size:15px;padding:8px 10px;border-radius:6px}
  .foot{color:var(--gray);font-size:11px;border-top:1px solid var(--line);margin-top:14px;padding-top:8px}
  #selftest{font-family:monospace;font-size:12px;margin:8px 0;color:#0a7d33}
  /* 정산서(내부용) */
  #settle{display:none;margin:16px 0}
  .settle-doc{background:#fff;border:1px solid #cdd7e3;border-radius:12px;overflow:hidden}
  .settle-doc .band{background:#0f2a1e;color:#fff;padding:12px 18px;display:flex;justify-content:space-between;align-items:center}
  .settle-doc .band .t1{font-size:15px;font-weight:800}
  .settle-doc .band .tag{font-size:11px;background:#1e6f4c;border-radius:999px;padding:4px 10px;font-weight:700}
  .settle-doc .body{padding:14px 18px}
  table.settle{border-collapse:collapse;width:100%;font-size:13px}
  table.settle td{padding:7px 4px;border-bottom:1px solid #e6ecf3}
  table.settle td.r{text-align:right;font-variant-numeric:tabular-nums}
  table.settle td.k{color:#5a6683}
  table.settle tr.minus td.r{color:#b4521a}
  table.settle tr.base td{border-top:2px solid #cdd7e3;font-weight:700}
  table.settle tr.profit td{background:#e7f5ee;color:#0f2a1e;font-weight:800;font-size:15px;border-bottom:none}
  .settle-note{color:#8a93a3;font-size:11px;margin-top:8px}
  @media print{
    body{background:#fff}
    .noprint{display:none !important}
    .wrap{max-width:none;padding:0}
    #quote{display:block !important}
    .doc{border:none;border-radius:0}
    /* 정산서 전용 인쇄 모드: 견적서 숨기고 정산서만 출력 */
    body.mode-settle #quote{display:none !important}
    body.mode-settle #settle{display:block !important}
    body.mode-settle #settle .settle-doc{border:none;border-radius:0}
  }
  .settle-ctx{font-size:12px;color:#334;border-bottom:1px solid #e6ecf3;padding-bottom:10px;margin-bottom:10px;line-height:1.7}
  .settle-ctx b{color:#0f2a1e}

:root{
 --dbx-navy:#26314a;--dbx-navy2:#1b2439;--dbx-y:#fcd469;--dbx-y2:#ffde7e;
 --dbx-paper:#f0f7ff;--dbx-card:#fff;--dbx-ink:#26314a;--dbx-ink-soft:#5a6683;
 --dbx-line:#e6edf6;--dbx-r:16px;--dbx-max:1160px;--dbx-pad:28px;
 --dbx-shadow:0 1px 2px rgba(38,49,74,.04),0 8px 28px rgba(38,49,74,.07);
 --dbx-sans:Inter,Pretendard,"Segoe UI","Malgun Gothic","맑은 고딕",system-ui,-apple-system,sans-serif;
 --bg:#f0f7ff;--fg:#26314a;--card:#fff;--line:#e6edf6;--accent:#26314a;--muted:#5a6683;
}
@media (prefers-color-scheme:dark){:root{
 --bg:#f0f7ff!important;--fg:#26314a!important;--card:#fff!important;
 --line:#e6edf6!important;--accent:#26314a!important;--muted:#5a6683!important;}}
body{background:var(--dbx-paper)!important;color:var(--dbx-ink);font-family:var(--dbx-sans)!important;margin:0;-webkit-font-smoothing:antialiased}

/* ── 상단바(헤더) ── */
.dbx-hero{background:var(--dbx-card);border-bottom:1px solid var(--dbx-line);position:sticky;top:0;z-index:30}
.dbx-hero-in{max-width:var(--dbx-max);margin:0 auto;padding:16px var(--dbx-pad) 0;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.dbx-brand{display:flex;align-items:center;gap:12px;min-width:0}
.dbx-crest{width:42px;height:42px;flex:none;border-radius:12px;background:var(--dbx-navy);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:800;letter-spacing:.02em;box-shadow:0 6px 16px rgba(38,49,74,.22);position:relative}
.dbx-crest::after{content:"";position:absolute;right:-3px;bottom:-3px;width:14px;height:14px;border-radius:5px;background:var(--dbx-y);border:2px solid var(--dbx-card)}
.dbx-wm{font-size:20px;font-weight:800;letter-spacing:-.01em;color:var(--dbx-navy);margin:0;line-height:1.15}
.dbx-sub{font-size:12px;font-weight:600;color:var(--dbx-ink-soft);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dbx-meta{text-align:right;font-size:11.5px;color:var(--dbx-ink-soft);font-weight:600}
.dbx-meta .pill{display:inline-block;background:var(--dbx-paper);border:1px solid var(--dbx-line);border-radius:999px;padding:7px 15px;font-size:12.5px;font-weight:700;color:var(--dbx-navy)}
.dbx-meta .dt{margin-top:6px;display:block}
/* ── 네비(아이콘 pill) ── */
.dbx-nav{max-width:var(--dbx-max);margin:0 auto;padding:12px var(--dbx-pad) 14px;display:flex;gap:6px;overflow-x:auto}
.dbx-nav::-webkit-scrollbar{height:0}
.dbx-nav a{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;font-size:13.5px;font-weight:700;white-space:nowrap;color:var(--dbx-ink-soft);border-radius:999px;text-decoration:none;transition:all .15s}
.dbx-nav a .ic{width:17px;height:17px;flex:none;display:inline-flex;color:var(--dbx-ink-soft)}
.dbx-nav a .ic svg{width:100%;height:100%;display:block}
.dbx-nav a:hover{background:var(--dbx-paper);color:var(--dbx-navy)}
.dbx-nav a:hover .ic{color:var(--dbx-navy)}
.dbx-nav a.on{color:#fff;background:var(--dbx-navy);box-shadow:0 8px 20px rgba(38,49,74,.24)}
.dbx-nav a.on .ic{color:var(--dbx-y)}

/* ── 본문 컨테이너(헤더와 동일한 좌우 라인) ── */
.dbx-main{max-width:var(--dbx-max);margin:0 auto;padding:24px var(--dbx-pad) 64px}
.dbx-sec{background:var(--dbx-card);border:1px solid var(--dbx-line);border-radius:var(--dbx-r);box-shadow:var(--dbx-shadow);padding:22px 24px;margin:18px 0}
.dbx-sec:first-child{margin-top:0}
.dbx-sec-h{display:flex;align-items:center;gap:10px;margin:0 0 16px;flex-wrap:wrap}
.dbx-sec-h .num{background:var(--dbx-y);color:var(--dbx-navy);font-size:11px;font-weight:800;padding:5px 12px;border-radius:999px;line-height:1;white-space:nowrap}
.dbx-sec-h .t{margin:0;font-size:16px;font-weight:800;color:var(--dbx-navy)}
/* 표 */
.dbx-main table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;min-width:640px}
.dbx-main th,.dbx-main td{padding:11px 14px;text-align:left;white-space:nowrap;border:0;border-bottom:1px solid var(--dbx-line)}
.dbx-main thead th{position:sticky;top:0;background:#eef3fb;color:var(--dbx-navy);font-weight:700;cursor:pointer}
.dbx-main tbody tr:nth-child(even) td{background:#f7faff}
.dbx-main tbody tr:hover td{background:#eef3fb}
.dbx-main .wrap{overflow-x:auto;padding:0}
.dbx-main .filters{background:var(--dbx-card);border:1px solid var(--dbx-line);border-radius:var(--dbx-r);box-shadow:var(--dbx-shadow);padding:18px 20px;margin:0 0 18px;gap:14px}
.dbx-main .count{padding:0 2px 12px;color:var(--dbx-ink-soft);font-weight:600}
.dbx-main .hint{padding:30px 8px;color:var(--dbx-ink-soft);font-size:14px}
.dbx-main .kpis{padding:0;gap:12px;margin:0 0 4px}
.dbx-main .kpi{background:var(--dbx-card);border:1px solid var(--dbx-line);border-radius:16px;box-shadow:var(--dbx-shadow);padding:16px 20px}
.dbx-main .chart-wrap,.dbx-main .donuts{padding:0}
.dbx-main h2{padding:0;margin:0 0 6px;font-size:16px;color:var(--dbx-navy)}
.dbx-main .sub-note{padding:0 0 12px;color:var(--dbx-ink-soft)}
/* 탭 */
.dbx-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 4px}
.dbx-tabs button{padding:9px 18px;font-size:13px;font-weight:700;border-radius:999px;border:1px solid var(--dbx-line);background:var(--dbx-card);color:var(--dbx-ink-soft);cursor:pointer;font-family:var(--dbx-sans);transition:all .15s}
.dbx-tabs button:hover{border-color:var(--dbx-navy);color:var(--dbx-navy)}
.dbx-tabs button.on{background:var(--dbx-navy);color:#fff;border-color:var(--dbx-navy);box-shadow:0 6px 16px rgba(38,49,74,.2)}
.dbx-tab{display:none}.dbx-tab.on{display:block}
.dbx-main .panel{background:var(--dbx-card);border:1px solid var(--dbx-line);border-radius:16px;box-shadow:var(--dbx-shadow)}
@media print{.dbx-hero,.dbx-nav{display:none!important}}

const TYPE_MAP=[["베란다","VERANDAH"],["발코니","VERANDAH"],["verandah","VERANDAH"],["인사이드","INSIDE"],["내측","INSIDE"],["안쪽","INSIDE"],["inside","INSIDE"],["오션뷰","OUTSIDE"],["바다","OUTSIDE"],["외측","OUTSIDE"],["해측","OUTSIDE"],["outside","OUTSIDE"],["oceanview","OUTSIDE"],["스위트","SUITE"],["컨시어지","SUITE"],["suite","SUITE"],["concierge","SUITE"]];

function parseEmail(t){
  const o={};
  let m=t.match(/(20\d{2})\s*[.\-년]\s*(\d{1,2})\s*[.\-월]\s*(\d{1,2})/);
  if(m) o.iso=`${m[1]}-${String(+m[2]).padStart(2,"0")}-${String(+m[3]).padStart(2,"0")}`;
  m=t.match(/(\d+)\s*(명|인|인원|pax|adults?)/i); if(m) o.guests=+m[1];
  m=t.match(/(\d+)\s*(층|덱|deck)/i); if(m) o.deck=+m[1];
  const low=t.toLowerCase();
  for(const [k,v] of TYPE_MAP){ if(low.includes(k)){o.type=v;break;} }
  for(const [k,v] of LOC_MAP){ if(t.includes(k)||low.includes(k)){o.loc=v;break;} }
  // 여행사·담당자: 본문 전체에서 각각 독립 추출(순서·줄·위치 무관)
  let ag=t.match(/([가-힣A-Za-z0-9]{1,15}(?:투어스|투어|여행사|여행|항공|관광|트래블))/);
  if(ag){ o.agency=ag[1]; }
  else { const en=t.match(/([A-Za-z][A-Za-z0-9 &]{1,20}(?:Travel|Tours|Tour))/i); if(en) o.agency=en[1].trim(); }
  const TITLE="대리|과장|차장|부장|사원|팀장|주임|이사|대표|사장|상무|전무|실장|본부장|매니저|담당";

function nearestDates(iso){

function searchRoom(q){

function computePricing(total,guests,rate){
  const base=total/2, primary=Math.min(guests,2), extra=Math.max(0,guests-2);

const NCF_DEFAULT=300;        // NCF 기본값(USD) — 화면 입력칸에서 조정 가능

      출발 ${ctx.iso||""}${ctx.weekday?` (${ctx.weekday})`:""} ${ctx.nights?ctx.nights+"박":""} · 객실 ${ctx.category||""} / ${ctx.type||""} · 객실번호 ${ctx.roomNo||""} · 승객 ${ctx.guests||""}명
    </div>` : "";
  document.getElementById("settle").innerHTML=`
  <div class="settle-doc"><div class="band">
    <div class="t1">정산서 — 동보항공 수익</div><div class="tag">내부용 · 인쇄 제외</div>
  </div><div class="body">
    ${ctxHtml}
    <table class="settle">
      <tr><td class="k">견적 총금액 (기본 총 요금)</td><td class="r">USD ${money(s.subtotal)}</td></tr>
      <tr class="minus"><td class="k">(−) TAX (실제)</td><td class="r">${money(s.tax)}</td></tr>
      <tr class="minus"><td class="k">(−) NCF</td><td class="r">${money(s.ncf)}</td></tr>
      <tr class="base"><td class="k">정산 기준액</td><td class="r">${money(s.base)}</td></tr>
      <tr><td class="k">× 수익 배수</td><td class="r">${s.rate}</td></tr>
      <tr class="profit"><td>동보항공 수익</td><td class="r">USD ${money(s.profit)}</td></tr>
    </table>
    <div class="settle-note">※ 수익 = (견적 총금액 − TAX − NCF) × ${s.rate}. TAX는 수집된 2인 실제 세금, NCF·수익 배수는 상단 입력칸에서 조정 가능. 내부 정산용이며 고객 견적서 인쇄/PDF에는 표시되지 않습니다.</div>
  </div></div>`;
  document.getElementById("settle").style.display="block";
}
function badgeText(level,q){
  if(level==="exact") return "";
  if(level==="loc") return `요청하신 ${q.deck}층 ${locKr(q.loc)} 객실이 없어 다른 층의 ${locKr(q.loc)} 객실로 안내드립니다.`;
  if(level==="type") return `요청 위치(${q.deck}층 ${locKr(q.loc)}) 객실이 없어 동일 타입의 예약 가능한 최저가 객실로 안내드립니다.`;
  return "";
}
const locKr=l=>({MID:"가운데",FORWARD:"앞쪽",AFT:"뒤쪽",GTY:"미배정"}[l]||l);
function dateInfo(iso){return DATA.dates.find(d=>d.iso===iso)||{iso,weekday:"",nights:""};}
function todayISO(){const n=new Date();return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}`;}
function addDays(iso,n){const d=new Date(Date.parse(iso));d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}

function renderQuote(q,room,pr,level){
  const di=dateInfo(q.iso), today=todayISO();
  const qno=`Q-${today.replace(/-/g,"")}-${q.iso.replace(/-/g,"")}-${room.category}`;
  const valid=addDays(today,7);
  const badge=badgeText(level,q);
  const recvName=q.agency||q.customer||"고객";
  const recvSub=(q.agency&&q.customer)?` <span style="font-weight:400;color:var(--gray)">(담당: ${q.customer})</span>`:"";
  const extraRow = pr.extra>0 ? `<tr><td>추가요금(3·4번째, 기본의 70%)</td><td class="r">${money(pr.extra_pp)}</td><td class="r">${pr.extra}</td><td class="r">${money(pr.extra_amt)}</td></tr>`:"";
  document.getElementById("quote").innerHTML=`
  <div class="doc"><div class="band">
    <div><div class="t1">동보항공</div><div class="t2">QUOTATION 견적서</div></div>
    <div class="meta">견적번호 ${qno}<br>견적일 ${today}<br>유효기간 ${valid}</div>
  </div><div class="body">
    <div class="cust">${recvName} 귀하${recvSub}</div>
    ${badge?`<div class="badge">${badge}</div>`:""}
    <div class="sec-title">ITINERARY</div>
    <table class="kv"><tr><td class="k">선박</td><td>${DATA.ship}</td></tr>
      <tr><td class="k">출발일</td><td>${q.iso} (${di.weekday})</td></tr>
      <tr><td class="k">박수</td><td>${di.nights}박</td></tr></table>
    <div class="sec-title">STATEROOM</div>
    <table class="kv"><tr><td class="k">카테고리</td><td>${room.category}</td></tr>
      <tr><td class="k">타입</td><td>${room.type} / ${room.subtype}</td></tr>
      <tr><td class="k">위치</td><td>${room.location} (${locKr(room.location)}) · ${room.deck}층</td></tr>
      <tr><td class="k">객실번호</td><td>${room.roomNo}</td></tr>
      <tr><td class="k">승객수</td><td>${q.guests}</td></tr></table>
    <div class="sec-title">BREAK DOWN</div>
    <div class="usd">(USD)</div>
    <table class="fee"><tr><th>항목</th><th class="r">단가</th><th class="r">수량</th><th class="r">금액</th></tr>
      <tr><td>기본요금(성인 1·2번째)</td><td class="r">${money(pr.base_pp)}</td><td class="r">${pr.primary}</td><td class="r">${money(pr.base_amt)}</td></tr>
      ${extraRow}</table>
    <div class="sum">
      <div class="line"><span class="lbl">기본 총 요금</span><span>${money(pr.subtotal)}</span></div>
      <div class="line"><span class="lbl">커미션(${(pr.rate*100).toFixed(0)}%)</span><span>${money(pr.commission)}</span></div>
      <div class="line final">최종 청구액 (공급가) &nbsp; USD ${money(pr.supply)}</div>
    </div>
    <div class="sec-title">취소료 규정</div>
    <div style="font-size:12px;color:#444">※ 취소료 규정은 추후 별도 안내드립니다.</div>
    <div class="foot">※ USD·세금 포함·성인 기준. 요금은 예약 시점에 변동될 수 있으며 본 견적은 유효기간 내 유효합니다.</div>
  </div></div>`;
  document.getElementById("quote").style.display="block";
  document.getElementById("printbar").style.display="flex";
  const ncf=+document.getElementById("f_ncf").value;
  const prate=+document.getElementById("f_profit").value;
  const settleCtx={qno, today, agency:(q.agency||""), customer:(q.customer||""),
    cust:(q.customer||q.agency||"고객"), iso:q.iso,
    weekday:di.weekday, nights:di.nights, category:room.category, type:room.type,
    roomNo:room.roomNo, guests:q.guests};
  renderSettle(computeSettle(pr.subtotal, room.tax, ncf, prate), settleCtx);
}

function resetReview(){
  const q=document.getElementById("quote"); q.style.display="none"; q.innerHTML="";
  const st=document.getElementById("settle"); st.style.display="none"; st.innerHTML="";
  document.getElementById("printbar").style.display="none";
  document.getElementById("isohint").textContent="";
  document.getElementById("f_guests").value=2;
  document.getElementById("f_type").value="VERANDAH";
  document.getElementById("f_loc").value="MID";
  document.getElementById("f_deck").value="";
  document.getElementById("f_agency").value="";
  document.getElementById("f_customer").value="";
  // f_rate(커미션율)와 f_iso는 여기서 리셋하지 않음(각각 정책값 유지 / fillReview에서 첫 날짜 설정)
}
function fillReview(o){
  const sel=document.getElementById("f_iso"); sel.innerHTML="";
  DATA.dates.forEach(d=>{const op=document.createElement("option");op.value=d.iso;op.textContent=`${d.iso} (${d.weekday}) ${d.nights}박`;sel.appendChild(op);});
  resetReview();
  sel.value=DATA.dates[0].iso;                       // 기본: 목록 첫 날짜
  const hint=document.getElementById("isohint");
  if(o.iso && DATA.dates.some(d=>d.iso===o.iso)){ sel.value=o.iso; }
  else if(o.iso){ const nd=nearestDates(o.iso); sel.value=nd[0].iso; hint.textContent=`요청 출발일 ${o.iso}은(는) 예약 가능 목록에 없어 가까운 날짜(${nd.map(x=>x.iso).join(", ")})로 제안합니다. 확인해주세요.`; }
  if(o.guests) document.getElementById("f_guests").value=o.guests;
  if(o.type) document.getElementById("f_type").value=o.type;
  if(o.deck) document.getElementById("f_deck").value=o.deck;
  if(o.loc) document.getElementById("f_loc").value=o.loc;
  if(o.agency) document.getElementById("f_agency").value=o.agency;
  if(o.customer) document.getElementById("f_customer").value=o.customer;
  document.getElementById("review").style.display="block";
}
function doGenerate(){
  const q={iso:document.getElementById("f_iso").value,
    guests:+document.getElementById("f_guests").value||2,
    type:document.getElementById("f_type").value,
    deck:+document.getElementById("f_deck").value,
    loc:document.getElementById("f_loc").value,
    agency:document.getElementById("f_agency").value,
    customer:document.getElementById("f_customer").value};
  const rate=+document.getElementById("f_rate").value||0.05;
  const {room,level}=searchRoom(q);
  if(!room){
    const el=document.getElementById("quote");
    el.innerHTML=`<div class="panel" style="color:#b4521a">해당 조건에 예약 가능한 객실이 없습니다. 출발일·타입·인원·위치를 조정해주세요.</div>`;
    el.style.display="block"; document.getElementById("printbar").style.display="none";
    const st=document.getElementById("settle"); st.style.display="none"; st.innerHTML="";
    return;
  }
  const pr=computePricing(room.minTotal,q.guests,rate);
  renderQuote(q,room,pr,level);
}
document.getElementById("analyze").onclick=()=>{ fillReview(parseEmail(document.getElementById("email").value)); doGenerate(); };
const autoGen=()=>{ if(document.getElementById("review").style.display==="block") doGenerate(); };
["f_iso","f_guests","f_type","f_deck","f_loc","f_rate","f_ncf","f_profit","f_agency","f_customer"].forEach(id=>{
  const el=document.getElementById(id);
  el.addEventListener("change",autoGen); el.addEventListener("input",autoGen);
});
document.getElementById("print").onclick=()=>{ document.body.classList.remove("mode-settle"); window.print(); };
document.getElementById("printSettle").onclick=()=>{
  if(document.getElementById("settle").style.display!=="block") return;  // 정산서 없으면 무시
  document.body.classList.add("mode-settle"); window.print();
};
window.addEventListener("afterprint",()=>document.body.classList.remove("mode-settle"));

// ---- 자체 테스트 (?selftest=1) ----
if(location.search.includes("selftest=1")){
  const out=[]; const ok=(c,m)=>out.push((c?"ok":"FAIL")+" "+m);
  const SAMPLE="하나투어 홍진경 대리\n디즈니 어드벤처 예약 요청\n2026년 12월 10일 출발 4명 1객실\n베란다 객실 15층 가운데";

  const s2=computeSettle(1917.9,93.9);

  ok(s2.profit===76.2,"settle profit2 "+s2.profit);      // 1524*0.05
  const s3=computeSettle(1824,93.9,500,0.1);              // 커스텀 NCF·배수
  ok(s3.base===1230.1,"settle custom base "+s3.base);     // 1824-93.9-500
  ok(s3.profit===123.01,"settle custom profit "+s3.profit);// 1230.1*0.1
  ok(s3.ncf===500&&s3.rate===0.1,"settle custom params");
  const a=computePricing(2349.9,2,0.05),b=computePricing(2349.9,3,0.05),c=computePricing(2349.9,4,0.05);
  ok(a.supply===2232.4,"price 2인 "+a.supply);
  ok(b.supply===3013.75,"price 3인 "+b.supply);
  ok(c.supply===3795.1,"price 4인 "+c.supply);
  if(DATA&&DATA.index){
    const s=searchRoom({iso:"2026-12-10",guests:4,type:"VERANDAH",deck:15,loc:"MID"});
    ok(s.level==="exact"&&s.room&&s.room.minTotal===2443.9,"search VERANDAH/15/MID "+(s.room&&s.room.minTotal));
  }
  // ---- 추출 보강 테스트 ----
  ok(parseEmail("행복여행사 김철수 과장 드림").agency==="행복여행사","ext agency 여행사");
  ok(parseEmail("행복여행사 김철수 과장 드림").customer==="김철수 과장","ext customer 직급");
  ok(parseEmail("문의드립니다\n감사합니다\n블루오션트래블 이영희 대리").agency==="블루오션트래블","ext agency 트래블/서명란");
  ok(parseEmail("담당자: 박민수\n예약 문의").customer==="박민수","ext customer 라벨형");
  ok(parseEmail("홍길동 대리\n노랑풍선투어").agency==="노랑풍선투어","ext agency 순서역전");
  ok(parseEmail("홍길동 대리\n노랑풍선투어").customer==="홍길동 대리","ext customer 순서역전");
  // ---- 재분석 갱신 테스트 ----
  if(DATA&&DATA.dates&&DATA.dates.length){
    fillReview(parseEmail(SAMPLE));                 // A: 4인/VERANDAH/15/MID/하나투어
    document.getElementById("f_rate").value="0.08"; // 사용자가 커미션율 수정
    doGenerate();                                    // 이전 견적서 생성(숨김 검증용)
    const B="예약 문의\n2명 부탁드립니다";           // B: 인원만 언급
    fillReview(parseEmail(B));
    ok(document.getElementById("f_guests").value==="2","re guests→2");
    ok(document.getElementById("f_type").value==="VERANDAH","re type reset→VERANDAH");
    ok(document.getElementById("f_loc").value==="MID","re loc reset→MID");
    ok(document.getElementById("f_deck").value==="","re deck reset→빈칸");
    ok(document.getElementById("f_agency").value==="","re agency reset→빈칸");
    ok(document.getElementById("f_customer").value==="","re customer reset→빈칸");

  }
  // ---- 견적서 자동 생성 테스트 ----
  if(DATA&&DATA.dates&&DATA.dates.length){
    document.getElementById("email").value="2026년 12월 10일 4명 베란다 15층 가운데";
    document.getElementById("analyze").click();     // 분석 후 자동 생성되어야 함
    ok(document.getElementById("quote").style.display==="block","autogen after analyze 표시");
    ok(document.getElementById("quote").textContent.includes("최종 청구액"),"autogen 최종청구액 포함");
    ok(document.getElementById("settle").style.display==="block","autogen 정산서 표시");
    ok(document.getElementById("settle").textContent.includes("동보항공 수익"),"autogen 정산서 수익 포함");

  const fail=out.filter(x=>x.startsWith("FAIL"));
  document.getElementById("selftest").textContent=(fail.length?"SELFTEST: FAIL: ":"SELFTEST: PASS · ")+out.join(" | ");
